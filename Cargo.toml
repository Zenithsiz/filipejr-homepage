[workspace]

members  = ["homepage", "homepage-backend", "homepage-frontend"]
resolver = "2"

[workspace.package]
authors      = ["Filipe Rodrigues <filipejacintorodrigues1@gmail.com>"]
license-file = "LICENSE-MIT"

[workspace.dependencies]

app-error                = "0.1.0"
axum                     = "0.8.8"
console_error_panic_hook = "0.1.7"
derive_more              = "2.1.1"
dynatos-builder          = { git = "https://github.com/Zenithsiz/dynatos", rev = "c0723c00e0a2aade1a86162f263d70bed150729b" }
dynatos-loadable         = { git = "https://github.com/Zenithsiz/dynatos", rev = "c0723c00e0a2aade1a86162f263d70bed150729b" }
dynatos-reactive         = { git = "https://github.com/Zenithsiz/dynatos", rev = "c0723c00e0a2aade1a86162f263d70bed150729b" }
dynatos-util             = { git = "https://github.com/Zenithsiz/dynatos", rev = "c0723c00e0a2aade1a86162f263d70bed150729b" }
dynatos-web              = { git = "https://github.com/Zenithsiz/dynatos", rev = "c0723c00e0a2aade1a86162f263d70bed150729b" }
dynatos-web-reactive     = { git = "https://github.com/Zenithsiz/dynatos", rev = "c0723c00e0a2aade1a86162f263d70bed150729b" }
dynatos-web-router       = { git = "https://github.com/Zenithsiz/dynatos", rev = "c0723c00e0a2aade1a86162f263d70bed150729b" }
dynatos-web-title        = { git = "https://github.com/Zenithsiz/dynatos", rev = "c0723c00e0a2aade1a86162f263d70bed150729b" }
extend                   = "1.2.0"
reqwest                  = "0.13.2"
serde                    = "1.0.228"
strum                    = "0.28.0"
tokio                    = "1.50.0"
toml                     = "1.0.6"
tracing                  = "0.1.44"
tracing-subscriber       = "0.3.22"
tracing-web              = "0.1.3"
url                      = "2.5.8"
wasm-bindgen             = "0.2.114"
web-sys                  = "0.3.91"
zutil-cloned             = "0.1.0"
zutil-logger             = "0.1.0"

[workspace.lints]

clippy.nursery  = { level = "warn", priority = -1 }
clippy.pedantic = { level = "warn", priority = -1 }

rust.unused_crate_dependencies = "warn"

# This triggers too often in plural forms
clippy.similar-names = "allow"
