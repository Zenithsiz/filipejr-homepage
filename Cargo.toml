[workspace]

members  = ["homepage", "homepage-backend", "homepage-dto", "homepage-frontend"]
resolver = "2"

[workspace.package]
authors      = ["Filipe Rodrigues <filipejacintorodrigues1@gmail.com>"]
license-file = "LICENSE-MIT"

[workspace.dependencies]

app-error                = "0.1.1"
axum                     = "0.8.8"
axum-cookie              = "0.2.4"
console_error_panic_hook = "0.1.7"
derive_more              = "2.1.1"
dynatos-loadable         = { default-features = false, git = "https://github.com/Zenithsiz/dynatos", rev = "511470d966246bb84fcdc3ffff8dabf2f5413599" }
dynatos-reactive         = { default-features = false, git = "https://github.com/Zenithsiz/dynatos", rev = "511470d966246bb84fcdc3ffff8dabf2f5413599" }
dynatos-sync-types       = { default-features = false, git = "https://github.com/Zenithsiz/dynatos", rev = "511470d966246bb84fcdc3ffff8dabf2f5413599" }
dynatos-util             = { default-features = false, git = "https://github.com/Zenithsiz/dynatos", rev = "511470d966246bb84fcdc3ffff8dabf2f5413599" }
dynatos-web              = { default-features = false, git = "https://github.com/Zenithsiz/dynatos", rev = "511470d966246bb84fcdc3ffff8dabf2f5413599" }
dynatos-web-reactive     = { default-features = false, git = "https://github.com/Zenithsiz/dynatos", rev = "511470d966246bb84fcdc3ffff8dabf2f5413599" }
dynatos-web-router       = { default-features = false, git = "https://github.com/Zenithsiz/dynatos", rev = "511470d966246bb84fcdc3ffff8dabf2f5413599" }
dynatos-web-ssr          = { default-features = false, git = "https://github.com/Zenithsiz/dynatos", rev = "511470d966246bb84fcdc3ffff8dabf2f5413599" }
dynatos-web-ssr-server   = { default-features = false, git = "https://github.com/Zenithsiz/dynatos", rev = "511470d966246bb84fcdc3ffff8dabf2f5413599" }
dynatos-web-title        = { default-features = false, git = "https://github.com/Zenithsiz/dynatos", rev = "511470d966246bb84fcdc3ffff8dabf2f5413599" }
extend                   = "1.2.0"
reqwest                  = "0.13.2"
serde                    = "1.0.228"
strum                    = "0.28.0"
tokio                    = "1.50.0"
toml                     = "1.0.6"
tracing                  = "0.1.44"
tracing-subscriber       = "0.3.22"
tracing-web              = "0.1.3"
url                      = "2.5.8"
uuid                     = "1.23.0"
wasm-bindgen             = "0.2.114"
web-sys                  = "0.3.91"
zutil-cloned             = "0.1.0"
zutil-logger             = "0.1.0"

[workspace.lints]

clippy.nursery  = { level = "warn", priority = -1 }
clippy.pedantic = { level = "warn", priority = -1 }

rust.unused_crate_dependencies = "warn"

# This triggers too often in plural forms
clippy.similar-names = "allow"

# Misc.
clippy.missing_panics_doc = "allow"
clippy.option_if_let_else = "allow"
clippy.single_match_else  = "allow"
