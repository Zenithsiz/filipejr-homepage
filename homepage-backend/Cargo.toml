[package]
name         = "homepage-backend"
version      = "0.1.0"
edition      = "2024"
authors      = { workspace = true }
description  = "Homepage backend"
license-file = { workspace = true }

[package.metadata.deb]
maintainer-scripts = "debian/"
systemd-units      = { enable = false }
depends            = []

[dependencies]

# Workspace
homepage     = { default-features = false, features = ["ssr"], path = "../homepage" }
homepage-dto = { path = "../homepage-dto" }

app-error              = { workspace = true }
axum                   = { features = ["macros"], workspace = true }
dynatos-web-ssr-server = { features = ["axum"], workspace = true }
serde                  = { features = ["derive"], workspace = true }
tokio                  = { features = ["full"], workspace = true }
toml                   = { workspace = true }
tracing                = { workspace = true }
zutil-logger           = { workspace = true }

[lints]
workspace = true
