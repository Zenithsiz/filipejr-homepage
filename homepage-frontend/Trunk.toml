trunk-version = "0.21.4"

[build]
minify = "on_release"

[[proxy]]
rewrite = "/backend/"
backend = "http://localhost:8081/"

[[proxy]]
rewrite = "/ssr/"
backend = "http://localhost:8081/ssr/"

[[hooks]]
stage   = "build"
command = "./build-css.sh"

[[hooks]]
stage   = "post_build"
command = "./optimize-wasm.sh"
